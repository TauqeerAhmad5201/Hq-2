<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Mood Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Catch the Happy! 😊</h1>
        <div class="score-board">Score: <span id="score">0</span></div>
        <div id="game-area">
            <button id="start-btn">Start Game</button>
        </div>
        <p class="instructions">Click the happy faces before they disappear!</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
